name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Legion Rush 3D (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Verificar segredos da licença Unity
        if: ${{ env.UNITY_LICENSE == '' || env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == '' }}
        run: |
          echo "::error::Configure os segredos UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD em Settings > Secrets and variables > Actions. Veja o README."
          exit 1

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build APK (Unity 6000.0.83f1, IL2CPP ARM64)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.83f1
          targetPlatform: Android
          buildName: LegionRush3D
          buildMethod: LegionRush.EditorTools.ProjectSetup.BuildAndroid
          androidExportType: androidPackage

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LegionRush3D-APK
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Publicar APK numa release (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Legion Rush 3D — build ${{ github.run_number }}
          prerelease: true
          files: build/Android/*.apk
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
