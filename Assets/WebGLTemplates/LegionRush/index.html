<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1324; }
      /* Portrait 9:16 game area that always fits inside the browser window (never scrolls or crops). */
      #game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
              width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); }
      @supports (height: 100dvh) {
        #game { width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 16 / 9)); }
      }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1324; }
      #loading { position: absolute; left: 15%; right: 15%; top: 50%; height: 10px; border-radius: 5px;
                 background: #1d2b4a; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: linear-gradient(90deg, #3aa8ff, #8fe3ff); }
      #warning { position: absolute; left: 8px; right: 8px; top: 8px; font: 14px sans-serif; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div id="loading-fill"></div></div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        // Grava o save (Application.persistentDataPath) no IndexedDB a cada escrita; sem isso o progresso some ao recarregar.
        autoSyncPersistentDataPath: true,
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (msg, type) {
          if (type !== "error") { console.warn(msg); return; }
          var div = document.createElement("div");
          div.style = "background:#c33;color:#fff;padding:8px";
          div.textContent = msg;
          document.querySelector("#warning").appendChild(div);
        },
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
